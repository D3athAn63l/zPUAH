name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOD: public/PickUpAndHaul-Optimized

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore "${{ env.MOD }}/Source/IHoldMultipleThings/IHoldMultipleThings.csproj"
          dotnet restore "${{ env.MOD }}/Source/PickUpAndHaul/PickUpAndHaul.csproj"
          dotnet restore "${{ env.MOD }}/Source/PickUpAndHaul.Tests/PickUpAndHaul.Tests.csproj"

      # DEBUG compiles extra diagnostics (Log.Message tracing in the planner); make sure that path still builds.
      # Both configurations write to the same Assemblies folder, so the Release build below must come last.
      - name: Compile check (Debug)
        run: |
          dotnet build "${{ env.MOD }}/Source/IHoldMultipleThings/IHoldMultipleThings.csproj" -c Debug --no-restore
          dotnet build "${{ env.MOD }}/Source/PickUpAndHaul/PickUpAndHaul.csproj" -c Debug --no-restore

      # Must build first: PickUpAndHaul.csproj references its output DLL
      - name: Build IHoldMultipleThings (Release)
        run: dotnet build "${{ env.MOD }}/Source/IHoldMultipleThings/IHoldMultipleThings.csproj" -c Release --no-restore

      - name: Build PickUpAndHaul (Release)
        run: dotnet build "${{ env.MOD }}/Source/PickUpAndHaul/PickUpAndHaul.csproj" -c Release --no-restore

      # Pure planning logic + a verbatim copy of the pre-refactor algorithm run side by side; repository invariants.
      # No game files needed.
      - name: Test
        run: dotnet test "${{ env.MOD }}/Source/PickUpAndHaul.Tests/PickUpAndHaul.Tests.csproj" -c Release --no-restore

      - uses: actions/upload-artifact@v4
        with:
          name: PickUpAndHaul-Optimized-Assemblies
          path: ${{ env.MOD }}/1.6/Assemblies/*.dll
